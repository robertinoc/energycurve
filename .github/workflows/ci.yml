name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run's answer irrelevant, and
# two full runs of this job take two runners for ~12 minutes to tell you one
# thing. `main` is exempt: its runs are the record of what was released.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Without this the job's ceiling is GitHub's default of 6 hours. The browser
    # install below hung for 22 minutes on two pull requests at once, and a hung
    # check is worse than a failing one: nothing can merge and nothing says why.
    # Every green run so far finishes inside 6 minutes.
    timeout-minutes: 20
    env:
      # Placeholders only: routes are force-dynamic, so nothing connects to
      # these services at build time. They exist so config readers that
      # check for presence behave like a configured environment.
      WORKOS_CLIENT_ID: client_ci_placeholder
      WORKOS_API_KEY: sk_test_ci_placeholder
      WORKOS_COOKIE_PASSWORD: ci_placeholder_cookie_password_32chars!
      NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3010/auth/callback
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci_placeholder_service_role_key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        # Thresholds live in vitest.config.ts, including per-directory floors.
        # They are set to what has already been cleared, so this fails only on a
        # real drop — and the floors are raised as coverage lands, never lowered
        # to make a run pass.
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      # Advisory on purpose. A new critical advisory in a transitive dependency
      # would otherwise block every unrelated pull request until someone upstream
      # publishes a fix, and a gate that has to be bypassed to ship stops being
      # read. The output is here to be looked at; the decision stays human.
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

      # After the build, reusing its output: the e2e suite runs against `next start`,
      # not `next dev`, because it asserts on rendered metadata and structured data
      # and dev-mode output is not what ships.

      # Keyed on the resolved Playwright version **and the browser set**, not on
      # the lockfile hash: the browser build only changes when Playwright does,
      # so an unrelated dependency bump shouldn't throw away a 300 MB download.
      #
      # The browser set belongs in the key, and leaving it out cost a full red
      # run. When webkit and firefox were added to the matrix, the key was still
      # version-only — so the cache saved by an earlier chromium-only run still
      # hit, the install step was skipped as a cache hit, and 126 tests failed
      # with "Executable doesn't exist". Locally everything passed, because a
      # local cache already had all three.
      #
      # Defined once and used for both the key and the install command, so the
      # two can't drift apart again.
      - name: Resolve Playwright version
        id: playwright
        run: |
          BROWSERS="chromium webkit firefox"
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "browsers=$BROWSERS" >> "$GITHUB_OUTPUT"
          # Derived, never written twice: the cache key and the install command
          # have to name the same set or the cache lies.
          echo "browserkey=$(echo "$BROWSERS" | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.browserkey }}

      # `--with-deps` is back, narrowly, and the history matters.
      #
      # It was removed because it shells out to `sudo apt-get install`, which hung
      # for 22 minutes: apt blocks on a lock the runner image's own
      # unattended-upgrades holds, with no timeout of its own. Chromium alone did
      # not need it — the runner image ships the libraries headless chromium
      # wants — so dropping it was free.
      #
      # WebKit is not free. Its shared libraries (libwoff2, libopus, gstreamer,
      # libenchant, libsecret, libhyphen and friends) are simply not in the image,
      # so the binary installs and then fails to launch. Since webkit and
      # mobile-safari are the projects that caught the pricing table being
      # unreachable by keyboard on a phone, dropping them to avoid apt would mean
      # dropping the coverage that found the bug.
      #
      # So: stop the unattended-upgrades timer first, which is the actual cause of
      # the lock, and keep the step timeout as the backstop. If it ever hangs
      # again it fails in eight minutes with a name, not in twenty-two without one.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          sudo systemctl stop unattended-upgrades.service 2>/dev/null || true
          sudo systemctl disable --now apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          npx playwright install --with-deps ${{ steps.playwright.outputs.browsers }}

      - name: End-to-end tests
        timeout-minutes: 12
        run: npm run test:e2e

      # Only on failure, and only then: a trace is tens of megabytes and is
      # worth nothing for a run that passed. `trace: retain-on-failure` in
      # playwright.config.ts means this directory is empty unless something
      # actually broke — which is exactly when reproducing it locally is hardest.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
