name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run's answer irrelevant, and
# two full runs of this job take two runners for ~12 minutes to tell you one
# thing. `main` is exempt: its runs are the record of what was released.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Without this the job's ceiling is GitHub's default of 6 hours. The browser
    # install below hung for 22 minutes on two pull requests at once, and a hung
    # check is worse than a failing one: nothing can merge and nothing says why.
    # Every green run so far finishes inside 6 minutes.
    timeout-minutes: 20
    env:
      # Placeholders only: routes are force-dynamic, so nothing connects to
      # these services at build time. They exist so config readers that
      # check for presence behave like a configured environment.
      WORKOS_CLIENT_ID: client_ci_placeholder
      WORKOS_API_KEY: sk_test_ci_placeholder
      WORKOS_COOKIE_PASSWORD: ci_placeholder_cookie_password_32chars!
      NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3010/auth/callback
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci_placeholder_service_role_key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        # Thresholds live in vitest.config.ts, including per-directory floors.
        # They are set to what has already been cleared, so this fails only on a
        # real drop — and the floors are raised as coverage lands, never lowered
        # to make a run pass.
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      # Advisory on purpose. A new critical advisory in a transitive dependency
      # would otherwise block every unrelated pull request until someone upstream
      # publishes a fix, and a gate that has to be bypassed to ship stops being
      # read. The output is here to be looked at; the decision stays human.
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

      # After the build, reusing its output: the e2e suite runs against `next start`,
      # not `next dev`, because it asserts on rendered metadata and structured data
      # and dev-mode output is not what ships.

      # Keyed on the resolved Playwright version, not on the lockfile hash: the
      # browser build only changes when Playwright does, so an unrelated dependency
      # bump shouldn't throw away a 100 MB download.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # No `--with-deps`. That flag shells out to `sudo apt-get install`, which is
      # what actually hung: apt blocks on a lock the runner image's own
      # unattended-upgrades holds, with no timeout of its own. The ubuntu-latest
      # image already ships the shared libraries headless chromium needs — and if
      # that ever stops being true, chromium fails to launch and the e2e step says
      # so, which is a diagnosable failure instead of a silent stall.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: End-to-end tests
        timeout-minutes: 8
        run: npm run test:e2e

      # Only on failure, and only then: a trace is tens of megabytes and is
      # worth nothing for a run that passed. `trace: retain-on-failure` in
      # playwright.config.ts means this directory is empty unless something
      # actually broke — which is exactly when reproducing it locally is hardest.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
